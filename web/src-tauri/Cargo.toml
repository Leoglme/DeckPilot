[package]
name = "deckpilot-desktop"
version = "0.1.0"
description = "DeckPilot Desktop (Nuxt + Tauri)"
authors = ["Dibodev"]
edition = "2021"

[lib]
name = "deckpilot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }

[dependencies]
tauri = { version = "2.8.5", features = ["devtools"] }
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
openrgb2 = "0.3"
hidapi = "2"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
dirs = "6"
