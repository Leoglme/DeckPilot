<div class="dp-pc-preview" id="pcPreview" data-fx="wave" data-power="on">
  <div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span><span class="a3"></span></div>
  <div class="stage" id="pvStage" data-scope="all">
    <div class="pivot" id="pvPivot">
      <div class="pc">
        <div class="floor" aria-hidden="true"></div>
        <div class="part shell" aria-hidden="true">
          <div class="sk tray"></div>
          <div class="sk back"></div>
          <div class="sk psu-top"></div>
          <div class="sk psu-face"></div>
          <div class="sk psu-end"></div>
          <div class="sk top"></div>
          <div class="sk bottom"></div>
          <div class="sk striptop"></div>
          <div class="sk glass"></div>
          <div class="sk glass-front"></div>
        </div>
        <div class="part" data-part="mobo" role="button" tabindex="0" aria-label="Régler la carte mère">
          <div class="sk mobo-board">
            <span class="io"></span><span class="vrm"></span><span class="socket"></span> <span class="m2"></span
            ><span class="pcie"></span><span class="chipset"></span>
          </div>
          <div class="sk mobo-strip"></div>
        </div>
        <div class="part" aria-hidden="true">
          <div class="sk ram-stick" style="--rx3d: 88px"></div>
          <div class="sk ram-stick" style="--rx3d: 108px"></div>
          <div class="sk ram-stick" style="--rx3d: 128px"></div>
          <div class="sk ram-stick" style="--rx3d: 148px"></div>
        </div>
        <div class="part" data-part="aio" role="button" tabindex="0" aria-label="Régler le watercooling">
          <div class="sk rad-top"></div>
          <div class="sk rad-back"></div>
          <div class="sk rad-bottom"></div>
          <div class="sk rad-cap rad-cap--l"></div>
          <div class="sk rad-cap rad-cap--r"></div>
          <div class="sk rad-front"><i>LIQUID · 280</i></div>
          <div class="sk fan fan--slim fan--r1" style="--fc: var(--c2)">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
          <div class="sk fan fan--slim fan--r2" style="--fc: var(--c2)">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
          <div class="sk rad-glow"></div>
          <span class="sk pump-base-s pump-base-s--t"></span>
          <span class="sk pump-base-s pump-base-s--b"></span>
          <span class="sk pump-base-s pump-base-s--l"></span>
          <span class="sk pump-base-s pump-base-s--r"></span>
          <div class="sk pump-base"></div>
          <div class="sk tubes" aria-hidden="true">
            <svg viewBox="0 0 220 170" fill="none">
              <path d="M116 36 C 140 78, 96 96, 62 118" stroke="#241d33" stroke-width="9" stroke-linecap="round" />
              <path
                d="M116 36 C 140 78, 96 96, 62 118"
                stroke="rgba(255,255,255,0.16)"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path d="M138 36 C 168 88, 118 108, 84 124" stroke="#241d33" stroke-width="9" stroke-linecap="round" />
              <path
                d="M138 36 C 168 88, 118 108, 84 124"
                stroke="rgba(255,255,255,0.16)"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </div>
          <div class="sk pump-cap"><span class="pumpring"></span></div>
        </div>
        <div class="part" data-part="gpu" role="button" tabindex="0" aria-label="Régler la carte graphique">
          <div class="sk gpu-top"></div>
          <div class="sk gpu-side"><span class="gpustrip"></span></div>
          <div class="sk gpu-end"></div>
        </div>
        <div class="part" data-part="fans" role="button" tabindex="0" aria-label="Régler les ventilateurs du boîtier">
          <div class="sk fans-bracket"></div>
          <div class="sk fan fan--f1">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
          <div class="sk fan fan--f2">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
          <div class="sk fan fan--f3">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
          <div class="sk fan fan--rear">
            <span class="fan-face fan-face--b"></span><span class="blades"></span><span class="hub"></span
            ><span class="fan-face fan-face--f"></span><span class="fan-s fan-s--t"></span
            ><span class="fan-s fan-s--b"></span><span class="fan-s fan-s--l"></span
            ><span class="fan-s fan-s--r"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="pv-hud">
    <span class="pv-scene" id="sceneLbl">Abyss</span>
    <span class="pv-scope" id="scopeLbl">Tout le PC</span>
  </div>
</div>
