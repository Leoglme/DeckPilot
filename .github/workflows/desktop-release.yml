name: Desktop build & release (Tauri)

# Builds the Windows desktop app and publishes it to a GitHub release, so a friend just
# downloads the installer (plug-and-play). No auto-updater yet: signing keys are not set up
# (`createUpdaterArtifacts: false`) — add TAURI_SIGNING_* secrets + the updater plugin later,
# the way DevLeadHunter does, to enable in-app updates.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

concurrency:
  group: deckpilot-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop:
    name: Build desktop (windows)
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      # Version = 0.1.<run number> (semver patch = GitHub Actions run number), injected into
      # both Cargo.toml and tauri.conf.json before the build so each release is unique.
      - name: Set desktop version
        shell: bash
        run: |
          python << 'PY'
          import json, os, re
          version = "0.1.%s" % os.environ["GITHUB_RUN_NUMBER"]
          os.chdir("src-tauri")
          with open("Cargo.toml", encoding="utf-8") as f:
              lines = f.read().splitlines(keepends=True)
          in_package = False
          out = []
          for line in lines:
              stripped = line.strip()
              if stripped == "[package]":
                  in_package = True
              elif stripped.startswith("[") and stripped != "[package]":
                  in_package = False
              if in_package and re.match(r"^version\s*=\s*", line):
                  line = 'version = "%s"\n' % version
              out.append(line)
          with open("Cargo.toml", "w", encoding="utf-8") as f:
              f.writelines(out)
          with open("tauri.conf.json", encoding="utf-8") as f:
              conf = json.load(f)
          conf["version"] = version
          with open("tauri.conf.json", "w", encoding="utf-8") as f:
              json.dump(conf, f, indent=2, ensure_ascii=False)
              f.write("\n")
          print("Desktop version set to", version)
          PY

      - name: Sync Cargo.lock for new desktop version
        working-directory: web/src-tauri
        run: cargo update -p deckpilot-desktop

      - name: Build and publish desktop artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: web
          tagName: v0.1.${{ github.run_number }}
          releaseName: "DeckPilot Desktop v0.1.${{ github.run_number }}"
          releaseBody: |
            Build Windows (Tauri + Nuxt).

            **Version :** `0.1.${{ github.run_number }}` (semver patch = numéro de run GitHub Actions).
          releaseDraft: false
          prerelease: false
